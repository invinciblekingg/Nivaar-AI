services:
  postgres:
    image: postgres:16-alpine
    container_name: machineguard_postgres
    restart: always
    environment:
      POSTGRES_USER: machineguard
      POSTGRES_PASSWORD: machineguard_secure_pwd
      POSTGRES_DB: machineguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machineguard -d machineguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: machineguard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: machineguard_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://machineguard:machineguard_secure_pwd@postgres:5432/machineguard_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - WORKER_HEARTBEAT_TIMEOUT_SEC=15
      - JOB_LEASE_TIMEOUT_SEC=25
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared_storage:/app/storage

  worker_alpha:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: machineguard_worker_alpha
    restart: always
    command: ["python", "-m", "workers.worker_runner", "--worker-id", "worker_alpha"]
    environment:
      - DATABASE_URL=postgresql://machineguard:machineguard_secure_pwd@postgres:5432/machineguard_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared_storage:/app/storage

  worker_beta:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: machineguard_worker_beta
    restart: always
    command: ["python", "-m", "workers.worker_runner", "--worker-id", "worker_beta"]
    environment:
      - DATABASE_URL=postgresql://machineguard:machineguard_secure_pwd@postgres:5432/machineguard_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared_storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: machineguard_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  shared_storage:
