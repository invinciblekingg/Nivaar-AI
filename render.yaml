services:
  - type: web
    name: nivaar-ai
    runtime: python
    buildCommand: bash build.sh
    startCommand: python run_render.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: WORKER_HEARTBEAT_TIMEOUT_SEC
        value: "15"
      - key: JOB_LEASE_TIMEOUT_SEC
        value: "25"
